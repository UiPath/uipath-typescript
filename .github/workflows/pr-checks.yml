name: PR Checks

on:
  pull_request:
    branches:
      - main
    types:
      - opened           # When PR is first created
      - synchronize      # When new commits are pushed to PR branch
      - reopened         # When a closed PR is reopened
  workflow_dispatch:     # Allows manual trigger from GitHub UI

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    # Shared coverage pipeline (unit + integration + SonarCloud). The same
    # workflow is reused by weekly-coverage.yml so the integration-test secret
    # mapping is defined only once.
    uses: ./.github/workflows/coverage.yml
    secrets: inherit
    with:
      ref_label: ${{ github.base_ref }}

  test-and-build:
    # Gate job that reports the flat `test-and-build` status check required by
    # the main ruleset. A job using `uses:` reports its check as
    # `test-and-build / coverage`, which the ruleset does not match — so this
    # thin job preserves the exact required context name. `if: always()` ensures
    # it runs (and reports) even when coverage fails, then fails itself if the
    # coverage workflow did not succeed.
    needs: coverage
    if: always()
    runs-on: uipath-ubuntu-latest
    steps:
      - name: Check coverage result
        if: needs.coverage.result != 'success'
        run: |
          echo "Coverage workflow concluded with: ${{ needs.coverage.result }}"
          exit 1

  test-packages:
    runs-on: uipath-ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package:
          - telemetry
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  api-surface:
    # Reports changes to the public API. Never fails: a breaking change gets the
    # `breaking-change` label plus a comment, anything else gets a short comment,
    # and a PR that touches nothing public gets neither.
    #
    # The label is the part that matters downstream -- it makes "does this release
    # contain a breaking change?" answerable at release time, which is what went
    # wrong in #682 (shipped in a patch, no release note).
    #
    # Fork PRs get a read-only token, so the label and comment are skipped there,
    # same as the other PR bots in this repo.
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to commit the regenerated snapshot back to the PR
      pull-requests: write   # to label and comment
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # Check out the PR branch itself, not the merge commit, so the
          # regenerated snapshot can be committed back onto it.
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Classify public API changes
        id: check
        run: |
          # `|| code=$?` is required: the default shell is `bash -e`, which would
          # abort on a non-zero exit before the code could be read.
          # 0 = no public API change, 1 = breaking, 2 = additions only
          code=0
          node scripts/check-api-surface.mjs > api-surface-report.txt 2>&1 || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat api-surface-report.txt

      # Nobody should have to run a command to satisfy a check. CI regenerates
      # the snapshot and commits it back, so the PR diff carries the change and
      # the baseline stays current on its own. Pushes made with GITHUB_TOKEN do
      # not start another workflow run, so this cannot loop.
      - name: Commit the regenerated snapshot
        if: steps.check.outputs.code != '0' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          npm run api-surface:gen
          if git diff --quiet -- scripts/api-surface.txt; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/api-surface.txt
          git commit -m 'chore: update public API surface snapshot [skip ci]'
          # A concurrent push from the author just means we retry next run.
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}" \
            || echo '::warning::Could not push the regenerated snapshot (branch moved). It will be retried on the next push.'

      - name: Label and comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CODE: ${{ steps.check.outputs.code }}
        run: bash scripts/api-surface-pr-feedback.sh

  check-samples:
    # Sample-app convention gate. Runs the check-samples.mjs rules against the
    # sample apps changed in this PR (existing apps are a backlog; each becomes
    # enforced the next time it is changed). Not an oxlint rule — these are
    # filesystem/structural checks (file presence, README media, favicon) that a
    # source-code linter can't express, so they live as a script + this job.
    runs-on: uipath-ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The rule logic is unit-tested in tests/unit/scripts/check-samples.test.ts
      # (runs with the normal test suite); this job only gates changed apps.
      - name: Check changed sample apps
        # base_ref is empty on workflow_dispatch; fall back to main so the ref
        # is always valid (origin/main) instead of an invalid "origin/".
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: node scripts/check-samples.mjs --changed "origin/$BASE_REF"

  jsdoc-validation:
    # Fails when public API methods/parameters lack JSDoc. Uses TypeDoc's
    # built-in notDocumented validation (typedoc.validation.json) - no custom
    # parsing.
    runs-on: uipath-ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate JSDoc completeness
        run: npm run docs:validate
