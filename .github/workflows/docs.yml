name: Deploy Documentation
on:
  workflow_call:
    # Declared rather than inherited, so a caller hands over these two secrets
    # and nothing else. Not required: without them the JS Functions fetch falls
    # back to placeholder pages instead of failing the build.
    secrets:
      CODED_FUNCTIONS_DOCS_APP_ID:
        required: false
      CODED_FUNCTIONS_DOCS_PRIVATE_KEY:
        required: false
  workflow_dispatch:
  # Sent by UiPath/coded-functions-js when its docs/ changes on main, so the
  # JS Functions section refreshes without waiting for the next SDK release.
  repository_dispatch:
    types: [js-functions-docs-updated]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write
  deployments: write

jobs:
  build-and-deploy:
    runs-on: uipath-ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Install Node Dependencies
        run: |
          npm ci

      - name: Install Coded Action Apps Dependencies
        working-directory: packages/coded-action-app
        run: npm ci

      - name: Setup Python Virtual Environment
        run: |
          python3 -m venv docs-env
          source docs-env/bin/activate
          pip install -r docs/requirements.txt

      - name: Mint JS Functions Docs Token
        # UiPath/coded-functions-js is an INTERNAL repo, so the default
        # GITHUB_TOKEN cannot read it. Mint a short-lived installation token
        # scoped to that one repo (Contents: read). The action revokes it when
        # the job ends, so nothing long-lived is stored -- only the App id and
        # private key live in secrets.
        id: js_functions_docs_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.CODED_FUNCTIONS_DOCS_APP_ID }}
          private-key: ${{ secrets.CODED_FUNCTIONS_DOCS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: coded-functions-js

      - name: Generate API Documentation
        # docs:api also fetches the JS Functions pages from
        # UiPath/coded-functions-js using the token minted above.
        env:
          CODED_FUNCTIONS_DOCS_TOKEN: ${{ steps.js_functions_docs_token.outputs.token }}
        run: npm run docs:api

      - name: Build MkDocs Documentation
        run: |
          source docs-env/bin/activate
          mkdocs build

      - name: Deploy to GitHub Pages
        # Deploy the pre-built site/ (from the "Build MkDocs Documentation" step)
        # instead of `mkdocs gh-deploy --force`, which force-replaces the whole
        # gh-pages branch and would delete the PR-preview umbrella dir.
        # clean-exclude keeps `pr-preview/` intact while still removing stale
        # docs pages; force: false rebases instead of clobbering concurrent
        # preview deployments.
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f  # v4.8.0
        with:
          branch: gh-pages
          folder: site
          clean-exclude: pr-preview/
          force: false