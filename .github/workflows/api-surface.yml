name: API Surface

on:
  # No branch filter: the gate should run on every pull request, including into
  # release branches, not just those targeting main.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-surface-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-surface:
    # Regenerates the committed public-API snapshot and fails if it drifts.
    # The job does not judge whether a change is breaking — it only makes every
    # change to a published signature visible as a reviewable diff, which a
    # 2000-line feature PR otherwise buries.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check the public API surface
        run: node scripts/check-api-surface.mjs
