name: API Surface

on:
  # No branch filter: the gate should run on every pull request, including into
  # release branches, not just those targeting main.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-surface-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-surface:
    # Regenerates the committed public-API snapshot and fails if it drifts.
    # The job does not judge whether a change is breaking — it only makes every
    # change to a published signature visible as a reviewable diff, which a
    # 2000-line feature PR otherwise buries.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run api-surface:gen
      - name: Check for uncommitted API surface changes
        run: |
          # Stage first: `git diff` alone ignores untracked files, so a brand-new
          # subpath export would produce a new snapshot file the check never saw.
          git add -A -- api-surface
          if ! git diff --cached --quiet -- api-surface; then
            echo "::error::The public API surface changed but api-surface/ was not updated."
            echo ""
            echo "Run 'npm run api-surface:gen' and commit the result."
            echo "Review the diff below: removed (-) lines are signatures consumers can"
            echo "no longer call as written. Additions can also break consumers when they"
            echo "are newly required fields or parameters."
            echo ""
            git --no-pager diff --cached -- api-surface
            exit 1
          fi
          echo "API surface matches the committed snapshot."
