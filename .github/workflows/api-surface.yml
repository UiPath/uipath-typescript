name: API Surface

on:
  # No branch filter: the gate should run on every pull request, including into
  # release branches, not just those targeting main.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-surface-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-surface:
    # Fails only when the public API changed in a way that can break a
    # consumer: a removed or changed signature, or a newly required field.
    #
    # Anything else passes. A stale snapshot after a purely additive change is
    # reported as a warning, not a failure -- the snapshot still needs to be
    # committed so the baseline stays current, but forgetting to is not worth
    # blocking a merge over.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check for breaking public API changes
        run: |
          # `|| code=$?` is required: the default shell is `bash -e`, which
          # would abort on a non-zero exit before the code could be read.
          code=0
          node scripts/check-api-surface.mjs || code=$?
          case "$code" in
            0) exit 0 ;;   # no change
            2) exit 0 ;;   # additions only -- already warned above
            1) exit 1 ;;   # breaking
            *) echo "::error::check-api-surface.mjs exited with $code"; exit 1 ;;
          esac
